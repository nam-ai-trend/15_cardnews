<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>카드뉴스 슬라이드</title>
  <link rel="stylesheet" href="card_style.css">
</head>
<body>
  <div class="card-canvas">
    <!-- Header -->
    <header class="card-header">
      <div class="category-badge">
        <span class="dot"></span>
        <span id="category-text">부동산 핫이슈 · 청약</span>
      </div>
      <div class="date-indicator" id="date-text">2026.09.21</div>
    </header>

    <!-- Main Dynamic Content Zone -->
    <main id="slide-content-container">
      <!-- Injected dynamically via script -->
    </main>

    <!-- Footer -->
    <footer class="card-footer">
      <div class="author-handle">
        <div class="author-avatar" id="avatar-text">B</div>
        <span id="handle-text">@realestate_insights</span>
      </div>
      <div class="page-indicator" id="page-text">01 / 05</div>
    </footer>
  </div>
</body>
</html>
